<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="武汉大学 ACM-ICPC 协会奖项记录。"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>WHU ACM-ICPC</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=23" />
    <script src="script.js?v=16" defer></script>
  </head>
  <body>
    <header class="site-header">
      <button
        id="menu-toggle"
        class="menu-toggle"
        type="button"
        aria-label="打开菜单"
        aria-controls="site-sidebar"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a class="brand" href="#introduction" aria-label="WHU ACM-ICPC 首页">
        <img class="brand-logo" src="assets/logo.svg" alt="" />
        <h1 class="brand-name">WHU ACM-ICPC</h1>
      </a>
      <span id="page-title" class="page-title">社团与竞赛简介</span>
    </header>

    <aside id="site-sidebar" class="site-sidebar" aria-label="网站菜单" aria-hidden="true">
      <div class="sidebar-header">
        <span class="sidebar-heading">菜单</span>
        <button id="menu-close" class="menu-close" type="button" aria-label="关闭菜单">×</button>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" data-page="introduction" href="#introduction">社团与竞赛简介</a>
        <a class="sidebar-link" data-page="medals" href="#medals">奖牌陈列室</a>
        <a class="sidebar-link" data-page="players" href="#players">选手名录</a>
        <a class="sidebar-link" data-page="calendar" href="#calendar">比赛日历</a>
        <div class="sidebar-folder">
          <button class="sidebar-folder-toggle" data-tree-target="board-tree" type="button" aria-expanded="false">
            <span class="folder-chevron" aria-hidden="true"></span>
            <span>往届比赛榜单</span>
          </button>
          <div id="board-tree" class="board-tree" hidden></div>
        </div>
        <div class="sidebar-folder">
          <button class="sidebar-folder-toggle" data-tree-target="document-tree" type="button" aria-expanded="false">
            <span class="folder-chevron" aria-hidden="true"></span>
            <span>资料与通知</span>
          </button>
          <div id="document-tree" class="board-tree" hidden></div>
        </div>
      </nav>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭菜单" hidden></button>

    <main id="app-main">
      <section id="awards-page" class="awards" aria-label="赛季荣誉">
        <section class="award-filters" aria-labelledby="award-filter-title">
          <div class="award-filter-heading">
            <h2 id="award-filter-title">筛选比赛</h2>
          </div>
          <div class="award-filter-groups">
            <div class="award-filter-group" role="group" aria-labelledby="source-filter-label">
              <span id="source-filter-label" class="award-filter-label">比赛来源</span>
              <div class="award-filter-options">
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="source" data-filter-value="ICPC">
                  <span>ICPC</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="source" data-filter-value="CCPC">
                  <span>CCPC</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="award-filter-group" role="group" aria-labelledby="type-filter-label">
              <span id="type-filter-label" class="award-filter-label">赛事类型</span>
              <div class="award-filter-options">
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="type" data-filter-value="regional">
                  <span>区域赛</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="type" data-filter-value="final">
                  <span>决赛</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="type" data-filter-value="women">
                  <span>女生赛</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>
        </section>
        <div id="loading-status" class="loading-status" role="status"></div>
        <div id="season-list" class="season-list"></div>
      </section>
      <section id="players-page" class="players-page" aria-label="选手名录" hidden>
        <section class="award-filters" aria-labelledby="player-filter-title">
          <div class="award-filter-heading">
            <h2 id="player-filter-title">筛选比赛</h2>
          </div>
          <div class="award-filter-groups">
            <div class="award-filter-group" role="group" aria-labelledby="player-source-filter-label">
              <span id="player-source-filter-label" class="award-filter-label">比赛来源</span>
              <div class="award-filter-options">
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="source" data-filter-value="ICPC">
                  <span>ICPC</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="source" data-filter-value="CCPC">
                  <span>CCPC</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="award-filter-group" role="group" aria-labelledby="player-type-filter-label">
              <span id="player-type-filter-label" class="award-filter-label">赛事类型</span>
              <div class="award-filter-options">
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="type" data-filter-value="regional">
                  <span>区域赛</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="type" data-filter-value="final">
                  <span>决赛</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
                <button class="filter-switch" type="button" role="switch" aria-checked="true" data-filter-group="type" data-filter-value="women">
                  <span>女生赛</span>
                  <span class="filter-switch-track" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="award-filter-group time-decay-filter" role="group" aria-labelledby="player-time-decay-label">
              <span id="player-time-decay-label" class="award-filter-label">时间流逝倍率</span>
              <div class="time-decay-control">
                <input id="player-time-decay" class="time-decay-range" type="range" min="0" max="1" step="0.01" value="0.80" aria-describedby="time-decay-help-text" />
                <output id="player-time-decay-value" class="time-decay-value" for="player-time-decay">0.80</output>
                <span class="filter-help-wrap">
                  <span class="filter-help" tabindex="0" aria-label="查看时间流逝倍率说明" aria-describedby="time-decay-help-text">?</span>
                  <span id="time-decay-help-text" class="filter-help-tooltip" role="tooltip">金、银、铜牌的基础积分分别为 4、2、1；决赛积分乘以 1.5，女生赛积分除以 1.5。设时间流逝倍率为 k，则当前赛季的奖牌按 1 倍计入，前一赛季按 k 倍、前两赛季按 k² 倍计入，以此类推。</span>
                </span>
              </div>
            </div>
          </div>
        </section>
        <div id="player-loading-status" class="loading-status" role="status"></div>
        <div id="player-list" class="player-list"></div>
      </section>
      <section id="board-page" class="board-page" aria-label="内容查看" hidden>
        <div class="board-frame-wrap">
          <iframe id="board-frame" class="board-frame" title="内容查看" loading="lazy"></iframe>
        </div>
      </section>
      <section id="calendar-page" class="calendar-page" aria-label="比赛日历" hidden>
        <div class="calendar-toolbar">
          <button id="calendar-previous" class="calendar-nav-button" type="button" aria-label="上一个月">‹</button>
          <h2 id="calendar-month" class="calendar-month" aria-live="polite"></h2>
          <button id="calendar-next" class="calendar-nav-button" type="button" aria-label="下一个月">›</button>
        </div>
        <div id="calendar-grid" class="calendar-grid" aria-label="比赛日历"></div>
      </section>
    </main>

    <dialog id="person-dialog" class="person-dialog" aria-labelledby="person-name">
      <div class="dialog-shell">
        <button class="dialog-close" type="button" aria-label="关闭个人记录">×</button>
        <header class="dialog-header person-dialog-header">
          <h2 id="person-name"></h2>
          <div id="person-summary" class="person-summary" aria-label="个人获奖统计"></div>
        </header>
        <div class="person-records-wrap">
          <table class="person-records">
            <thead>
              <tr>
                <th scope="col">赛季</th>
                <th scope="col">队伍</th>
                <th scope="col">比赛</th>
                <th scope="col">成绩</th>
              </tr>
            </thead>
            <tbody id="person-records-body"></tbody>
          </table>
        </div>
      </div>
    </dialog>

    <dialog id="contest-dialog" class="person-dialog" aria-labelledby="contest-name">
      <div class="dialog-shell">
        <button class="dialog-close" type="button" aria-label="关闭比赛记录">×</button>
        <header class="dialog-header">
          <h2 id="contest-name"></h2>
        </header>
        <div class="person-records-wrap">
          <table class="person-records contest-records">
            <thead>
              <tr>
                <th scope="col">赛季</th>
                <th scope="col">队伍</th>
                <th scope="col">奖项</th>
              </tr>
            </thead>
            <tbody id="contest-records-body"></tbody>
          </table>
        </div>
      </div>
    </dialog>
  </body>
</html>
